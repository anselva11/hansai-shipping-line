    <circle cx="1223" cy="461" r="5" fill="#111B14" />

    <!-- ==========================================================
         CONTAINER STENCIL MARKINGS (Exact match to reference image)
         ========================================================== -->
    
    <!-- Left Stencil: Cargo Container No. & Triangle Recycling Badge -->
    <g transform="translate(240, 155)" fill="#B0C8B8" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace">
      <text x="0" y="0" font-size="12" font-weight="600" letter-spacing="0.06em">Cargo container</text>
      <text x="0" y="19" font-size="13" font-weight="700" letter-spacing="0.08em">No. 025387162/53</text>

      <!-- Triangle Recycling Symbol with '50' -->
      <g transform="translate(2, 45)" stroke="#B0C8B8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15,0 L30,26 L0,26 Z" />
        <!-- Arrows indicating recycling loop -->
        <polyline points="13,0 17,0" />
        <text x="15" y="21" font-size="9" font-weight="700" fill="#B0C8B8" stroke="none" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">50</text>
      </g>

      <!-- Standard Maritime ISO specifications on door flank -->
      <g transform="translate(0, 95)" font-size="9" font-weight="600" letter-spacing="0.04em" opacity="0.85">
        <text x="0" y="0">MAX. WT.   32,500 KG  71,650 LBS</text>
        <text x="0" y="14">TARE WT.    3,980 KG   8,770 LBS</text>
        <text x="0" y="28">PAYLOAD    28,520 KG  62,880 LBS</text>
        <text x="0" y="42">CUBE         76.4 CBM   2,700 CU.FT.</text>
      </g>
    </g>

    <!-- ==========================================================
         HERO BRAND IDENTITY: /HANSAI (Emblazoned across ribs)
         ========================================================== -->
    <g transform="translate(680, 335)">
      <!-- Subtle dark drop shadow for maximum 3D paint relief on metal ribs -->
      <text x="2" y="4" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="108" font-weight="800" fill="#142217" letter-spacing="-0.03em" opacity="0.6">/HANSAI</text>
      
      <!-- Crisp White Brand Typography painted on ribs -->
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="108" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">/HANSAI</text>
      
      <!-- Sub-label: SHIPPING LINE in elegant industrial tracking -->
      <text x="6" y="32" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.42em" opacity="0.95">SHIPPING LINE</text>
    </g>

    <!-- Official HANSAI Logo Emblem Crest in crisp white on the left rib -->
    <g transform="translate(560, 255)" fill="#FFFFFF" opacity="0.92">
      <!-- Stylized nautical / shipping line crest -->
      <circle cx="28" cy="28" r="26" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M12,28 C18,20 38,20 44,28 C38,36 18,36 12,28 Z" fill="#FFFFFF" />
      <circle cx="28" cy="28" r="4.5" fill="#3B5844" />
      <line x1="28" y1="8" x2="28" y2="48" stroke="#FFFFFF" stroke-width="2.5" />
