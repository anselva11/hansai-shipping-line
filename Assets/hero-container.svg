    <rect x="175" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="208" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="241" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="274" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="307" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="340" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
