    <line x1="351" y1="130" x2="351" y2="452" stroke="#5E876A" stroke-width="1" opacity="0.35" />
    <rect x="373" y="129" width="24" height="324" fill="url(#ribGradGreen)" rx="2" />
    <line x1="384" y1="130" x2="384" y2="452" stroke="#5E876A" stroke-width="1" opacity="0.35" />
    <rect x="406" y="129" width="24" height="324" fill="url(#ribGradGreen)" rx="2" />
    <line x1="417" y1="130" x2="417" y2="452" stroke="#5E876A" stroke-width="1" opacity="0.35" />
