    <rect x="1198" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />

    <!-- Bottom White Container Top Rail -->
    <rect x="160" y="468" width="1070" height="15" fill="url(#whiteTopRail)" />
    <!-- Bottom White Container Bottom Rail -->
    <rect x="160" y="688" width="1070" height="14" fill="#A4AEB5" />

    <!-- Corner Post (Left) -->
    <rect x="160" y="468" width="15" height="234" fill="#9BA5AC" />
    <!-- Corner Casting Top Left -->
    <rect x="158" y="466" width="19" height="19" fill="#7D878E" rx="2" />
    <circle cx="167" cy="475" r="4.5" fill="#4B5358" />

    <!-- Stencil Text on White Container (Left Side) -->
    <g transform="translate(240, 508)" fill="#6B7882" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace">
      <text x="0" y="0" font-size="10.5" font-weight="600" letter-spacing="0.05em">Cargo container</text>
      <text x="0" y="16" font-size="11.5" font-weight="700" letter-spacing="0.08em">No. 025387162/53</text>
      <!-- Small weight details -->
      <text x="0" y="32" font-size="8.5" font-weight="500" letter-spacing="0.05em" opacity="0.8">MAX GROSS  32,500 KG</text>
      <text x="0" y="44" font-size="8.5" font-weight="500" letter-spacing="0.05em" opacity="0.8">TARE WEIGHT  3,980 KG</text>
    </g>

    <!-- Subtle Drop Shadow Cast by Top Container -->
    <rect x="160" y="468" width="1070" height="18" fill="#000000" opacity="0.32" />
  </g>

