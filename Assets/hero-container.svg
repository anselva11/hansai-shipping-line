<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Shadow beneath containers -->
    <filter id="containerShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Corrugation Rib Gradient (Green) -->
    <linearGradient id="ribGradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D4434" />
      <stop offset="25%" stop-color="#3D5A45" />
      <stop offset="65%" stop-color="#4E7058" />
      <stop offset="85%" stop-color="#385440" />
      <stop offset="100%" stop-color="#223528" />
    </linearGradient>

    <!-- Corrugation Rib Gradient (White) -->
    <linearGradient id="ribGradWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8C0C6" />
      <stop offset="25%" stop-color="#D6DCE0" />
      <stop offset="65%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#DEE3E6" />
      <stop offset="100%" stop-color="#A8B2B8" />
    </linearGradient>

    <!-- Corner Casting Gradient -->
    <linearGradient id="castingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557560" />
      <stop offset="100%" stop-color="#1A281E" />
    </linearGradient>

    <!-- Top Rail Highlight -->
    <linearGradient id="topRailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A8066" />
      <stop offset="50%" stop-color="#3A5642" />
      <stop offset="100%" stop-color="#263A2C" />
    </linearGradient>

    <!-- White Top Rail Highlight -->
    <linearGradient id="whiteTopRail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#D8DFE3" />
      <stop offset="100%" stop-color="#B0B9BF" />
    </linearGradient>
  </defs>

  <!-- AMBIENT BASE SHADOW -->
  <ellipse cx="650" cy="710" rx="600" ry="24" fill="#000000" opacity="0.12" filter="blur(16px)" />

  <!-- ==============================================================
       1. LEFT CONTAINER (IN PERSPECTIVE)
       ============================================================== -->
  <g id="left-container" opacity="0.95">
    <!-- Left face of adjacent green container -->
    <polygon points="0,290 160,310 160,700 0,680" fill="#223326" />
    <!-- Perspective ribs on left container -->
    <polygon points="20,293 45,296 45,683 20,680" fill="#2E4433" />
    <polygon points="55,297 80,300 80,687 55,684" fill="#2E4433" />
    <polygon points="90,301 115,304 115,692 90,689" fill="#2E4433" />
    <polygon points="125,305 150,308 150,696 125,693" fill="#2E4433" />
    <!-- Front corner vertical post -->
    <polygon points="152,308 162,310 162,700 152,698" fill="#18241B" />
  </g>

  <!-- ==============================================================
       2. RIGHT REAR CONTAINER (LIGHT ACCENT PEAKING BEHIND)
       ============================================================== -->
  <g id="right-rear-container" opacity="0.85">
    <polygon points="1220,400 1400,380 1400,700 1220,700" fill="#D2D8DC" />
    <polygon points="1230,402 1260,398 1260,700 1230,700" fill="#E4E9EC" />
    <polygon points="1275,396 1305,392 1305,700 1275,700" fill="#E4E9EC" />
    <polygon points="1320,390 1350,386 1350,700 1320,700" fill="#E4E9EC" />
    <polygon points="1365,384 1395,380 1395,700 1365,700" fill="#E4E9EC" />
  </g>

