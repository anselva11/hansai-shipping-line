    <rect x="637" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="670" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="703" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="736" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="769" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="802" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="835" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="868" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="901" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
    <rect x="934" y="482" width="24" height="206" fill="url(#ribGradWhite)" rx="1.5" />
