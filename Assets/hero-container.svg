    <!-- Right Vertical Structural Post -->
    <rect x="1214" y="110" width="16" height="360" fill="#1D2C21" />

    <!-- Corner Castings (Top-Left & Top-Right) -->
    <!-- Top Left -->
    <rect x="156" y="106" width="22" height="22" fill="url(#castingGrad)" rx="2.5" />
    <circle cx="167" cy="117" r="5" fill="#111B14" />
    <ellipse cx="167" cy="117" rx="3" ry="5.5" fill="#0B120D" />

    <!-- Bottom Left Casting -->
    <rect x="156" y="450" width="22" height="22" fill="url(#castingGrad)" rx="2.5" />
    <circle cx="167" cy="461" r="5" fill="#111B14" />

